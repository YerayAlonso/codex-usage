name: Feature request
description: Suggest an improvement that keeps the app lightweight.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
  - type: textarea
    id: platforms
    attributes:
      label: Affected platforms and resource considerations
      description: Consider tray compatibility, accessibility, CPU, memory, and background work.
