name: Bug report
description: Report a reproducible, non-sensitive problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow SECURITY.md instead of posting details publicly.
        Never attach authentication files, state.json, account IDs, or unredacted logs.
        Do not spend reset credits just to reproduce an issue.
  - type: input
    id: app-version
    attributes:
      label: App version or commit
      placeholder: "0.2.3 / commit SHA / development build"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: "Windows 11 x64; include desktop environment on Linux"
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex CLI version
      description: Output of codex --version, if relevant. Do not include login details.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include expected behavior and what actually happened.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics or screenshots
      description: Optional. Check for tokens, personal paths, account IDs, and pending reset keys first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have removed credentials and personal account data from this report.
          required: true
