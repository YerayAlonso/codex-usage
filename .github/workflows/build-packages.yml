name: Build packages

# Explicitly manual: no tags, release creation, signing secrets, or live Codex requests.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (macOS and Linux still need desktop validation)
        type: choice
        required: true
        default: windows
        options: [windows, macos, linux]

permissions:
  contents: read

concurrency:
  group: packages-${{ inputs.platform }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Unsigned packages / ${{ inputs.platform }}
    runs-on: ${{ inputs.platform == 'windows' && 'windows-latest' || inputs.platform == 'macos' && 'macos-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: packages
      - run: npm ci
      - run: npm run check:project
      - run: npm test
      - name: Build unsigned installers
        run: npm run build -- --bundles "${{ inputs.platform == 'windows' && 'nsis' || inputs.platform == 'macos' && 'app,dmg' || 'deb,appimage' }}"
      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          $bundle = (Resolve-Path 'src-tauri/target/release/bundle').Path
          $files = Get-ChildItem -LiteralPath $bundle -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi', '.dmg', '.deb', '.rpm', '.AppImage' }
          if (!$files) { throw 'No installers were produced.' }
          $lines = $files | Sort-Object FullName | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($bundle, $_.FullName).Replace('\', '/')
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $relative
          }
          [IO.File]::WriteAllText(
            (Join-Path $bundle 'SHA256SUMS.txt'),
            ($lines -join "`n") + "`n",
            [Text.UTF8Encoding]::new($false)
          )
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-usage-${{ inputs.platform }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/SHA256SUMS.txt
