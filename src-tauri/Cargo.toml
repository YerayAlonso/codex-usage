[package]
name = "codex-usage"
version = "0.2.3"
description = "Lightweight Codex quota and cycle tray monitor"
edition = "2021"
rust-version = "1.90"
authors = ["YerayAlonso"]
license = "MIT"
repository = "https://github.com/YerayAlonso/codex-usage"
homepage = "https://github.com/YerayAlonso/codex-usage"
readme = "../README.md"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
sys-locale = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
